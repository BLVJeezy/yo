<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vermogen">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314181F'/%3E%3Ctext x='50' y='63' font-family='Georgia,serif' font-size='46' fill='%230E6E58' text-anchor='middle'%3E%E2%82%AC%3C/text%3E%3C/svg%3E">
<title>Vermogen — Naar nul en verder</title>
<style>
  :root{
    --ink:#F2F4F8;
    --muted:#98A1B3;
    --line:rgba(255,255,255,0.10);
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.08);
    --debt:#FF7A6E;
    --debt-soft:rgba(255,122,110,0.12);
    --asset:#3DE6A8;
    --asset-soft:rgba(61,230,168,0.12);
    --ochre:#F0BC64;
    --radius:22px;
    --radius-s:14px;

    --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
    --data:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--body);
    background:#07090D;
    color:var(--ink);
    font-size:16px;
    line-height:1.4;
    padding:18px 14px calc(24px + env(safe-area-inset-bottom));
    max-width:640px;
    margin:0 auto;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  /* Ambient light layer behind the glass */
  body::before{
    content:'';
    position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(46% 34% at 18% 6%,  rgba(61,230,168,0.16), transparent 70%),
      radial-gradient(52% 40% at 88% 22%, rgba(96,140,255,0.13), transparent 72%),
      radial-gradient(44% 36% at 70% 96%, rgba(255,122,110,0.09), transparent 70%),
      #07090D;
  }

  .eyebrow{
    font-family:var(--data);
    font-size:0.66rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:500;
  }
  .num{font-family:var(--data);font-variant-numeric:tabular-nums;}

  /* ---- Glass primitive ---- */
  .hero,.section,.meter,.month{
    background:var(--glass);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    backdrop-filter:blur(24px) saturate(160%);
    border:1px solid var(--line);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.10),
      0 12px 32px rgba(0,0,0,0.38);
  }

  /* ---- Hero ---- */
  .hero{
    border-radius:26px;
    padding:22px 20px 20px;
    margin-bottom:14px;
  }
  .hero-net{
    font-family:var(--display);
    font-weight:700;
    font-size:2.5rem;
    letter-spacing:-0.03em;
    line-height:1.05;
    margin:8px 0 3px;
    font-variant-numeric:tabular-nums;
  }
  .hero-net.neg{color:var(--debt);text-shadow:0 0 28px rgba(255,122,110,0.38);}
  .hero-net.pos{color:var(--asset);text-shadow:0 0 28px rgba(61,230,168,0.38);}
  .hero-sub{font-size:0.83rem;color:var(--muted);margin-bottom:20px;}

  .track-wrap{margin-top:4px;}
  .track{
    position:relative;
    height:32px;
    border-radius:16px;
    overflow:hidden;
    background:rgba(255,255,255,0.05);
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.4);
    display:flex;
  }
  .track-debts{
    background:linear-gradient(180deg,#FF8B80,#E85E52);
    box-shadow:0 0 20px rgba(255,122,110,0.45);
    height:100%;transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .track-assets{
    background:linear-gradient(180deg,#4FF0B6,#25C08A);
    box-shadow:0 0 20px rgba(61,230,168,0.45);
    height:100%;transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  .track-tick{
    position:absolute;top:-3px;bottom:-3px;left:50%;
    width:2px;background:rgba(255,255,255,0.85);
    transform:translateX(-1px);
    box-shadow:0 0 8px rgba(255,255,255,0.5);
  }
  .track-tick::after{
    content:'';position:absolute;top:-4px;left:-3px;
    border-left:4px solid transparent;border-right:4px solid transparent;
    border-top:5px solid rgba(255,255,255,0.85);
  }
  .track-legend{
    display:flex;justify-content:space-between;
    margin-top:10px;font-size:0.72rem;
  }
  .track-legend .lg{display:flex;flex-direction:column;gap:1px;}
  .track-legend .lg.right{text-align:right;}
  .track-legend .k{color:var(--muted);font-size:0.66rem;letter-spacing:0.06em;text-transform:uppercase;}
  .track-legend .v{font-family:var(--data);font-weight:600;font-size:0.92rem;}
  .track-legend .v.d{color:var(--debt);}
  .track-legend .v.a{color:var(--asset);}
  .breakeven-note{
    text-align:center;font-size:0.66rem;color:var(--muted);
    margin-top:11px;font-family:var(--data);letter-spacing:0.04em;
  }

  .spark{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .spark svg{width:100%;height:44px;display:block;}
  .spark-label{display:flex;justify-content:space-between;font-size:0.66rem;color:var(--muted);margin-top:5px;font-family:var(--data);}

  /* ---- Sections ---- */
  .section{
    border-radius:var(--radius);
    margin-bottom:12px;
    overflow:hidden;
  }
  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:15px 17px;min-height:54px;cursor:pointer;user-select:none;
    touch-action:manipulation;
  }
  .section-head .title{
    font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:-0.01em;
  }
  .section-head .right{display:flex;align-items:center;gap:10px;}
  .section-total{font-family:var(--data);font-weight:600;font-size:0.98rem;}
  .section-total.d{color:var(--debt);}
  .section-total.a{color:var(--asset);}
  .caret{color:var(--muted);font-size:0.68rem;transition:transform .22s ease;}
  .caret.open{transform:rotate(90deg);}
  .section-body{display:none;}
  .section-body.open{display:block;}

  .line-row{
    display:flex;align-items:center;gap:12px;
    padding:11px 17px;border-top:1px solid var(--line);min-height:56px;
  }
  .line-label{flex:1;min-width:0;}
  .line-label .nm{font-size:0.9rem;display:block;}
  .line-label .grp{
    font-family:var(--data);font-size:0.62rem;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--muted);
  }
  .euro{color:var(--muted);font-family:var(--data);font-size:0.9rem;}
  .amt-in{
    width:112px;font-family:var(--data);font-size:16px;font-weight:500;
    padding:9px 11px;border:1px solid var(--line);border-radius:12px;
    text-align:right;background:rgba(255,255,255,0.05);color:var(--ink);
    font-variant-numeric:tabular-nums;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.30);
  }
  .amt-in:focus{
    outline:none;border-color:rgba(61,230,168,0.55);
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.30),0 0 0 3px rgba(61,230,168,0.18);
  }
  .amt-in:disabled{background:rgba(255,255,255,0.02);color:#5B6373;box-shadow:none;}

  /* ---- Meters ---- */
  .meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .meter{
    border-radius:18px;padding:13px 14px;
  }
  .meter .k{
    font-family:var(--data);font-size:0.6rem;letter-spacing:0.12em;
    text-transform:uppercase;color:var(--muted);display:block;margin-bottom:7px;
    line-height:1.35;min-height:2.3em;
  }
  .meter .v{font-family:var(--data);font-weight:600;font-size:1.04rem;letter-spacing:-0.01em;}
  .meter .sub{font-family:var(--data);font-size:0.66rem;color:var(--muted);margin-top:2px;}
  .meter-bar{height:5px;border-radius:3px;background:rgba(255,255,255,0.07);margin-top:10px;overflow:hidden;}
  .meter-bar i{display:block;height:100%;width:0;transition:width .45s ease;border-radius:3px;}
  .meter-bar i.d{background:linear-gradient(90deg,#E85E52,#FF8B80);box-shadow:0 0 10px rgba(255,122,110,0.55);}
  .meter-bar i.a{background:linear-gradient(90deg,#25C08A,#4FF0B6);box-shadow:0 0 10px rgba(61,230,168,0.55);}
  @media(max-width:380px){.meters{grid-template-columns:1fr;}}

  /* ---- Months ---- */
  .phase{
    font-family:var(--data);font-size:0.62rem;letter-spacing:0.14em;
    text-transform:uppercase;color:var(--muted);margin:22px 6px 9px;
  }
  .month{
    border-radius:var(--radius);margin-bottom:10px;overflow:hidden;
  }
  .month-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;min-height:62px;cursor:pointer;touch-action:manipulation;
  }
  .month-head.done{background:var(--asset-soft);box-shadow:inset 0 0 24px rgba(61,230,168,0.08);}
  .month-name{font-family:var(--display);font-weight:600;font-size:0.96rem;letter-spacing:-0.01em;}
  .month-sub{font-family:var(--data);font-size:0.7rem;color:var(--muted);margin-top:3px;}
  .milestone{
    display:inline-block;font-family:var(--data);font-size:0.64rem;font-weight:600;
    color:var(--ochre);background:rgba(240,188,100,0.12);
    padding:2px 9px;border-radius:8px;margin-top:6px;
    box-shadow:inset 0 0 12px rgba(240,188,100,0.08);
  }
  .pill{
    font-family:var(--data);font-size:0.66rem;font-weight:600;
    padding:4px 10px;border-radius:20px;
    background:rgba(255,255,255,0.07);color:var(--muted);
    border:1px solid var(--line);
    white-space:nowrap;
  }
  .pill.done{
    background:rgba(61,230,168,0.16);color:var(--asset);
    border-color:rgba(61,230,168,0.35);
    box-shadow:0 0 12px rgba(61,230,168,0.25);
  }
  .month-progress{height:3px;background:rgba(255,255,255,0.06);}
  .month-progress i{
    display:block;height:100%;width:0;transition:width .4s ease;
    background:linear-gradient(90deg,#25C08A,#4FF0B6);
    box-shadow:0 0 8px rgba(61,230,168,0.5);
  }
  .month-body{display:none;}
  .month-body.open{display:block;}
  .item{
    display:flex;align-items:center;gap:12px;
    padding:10px 16px;border-top:1px solid var(--line);min-height:60px;
  }
  .cbx{
    appearance:none;-webkit-appearance:none;
    width:26px;height:26px;flex-shrink:0;
    border:1.5px solid rgba(255,255,255,0.22);border-radius:9px;
    background:rgba(255,255,255,0.05);
    display:grid;place-content:center;cursor:pointer;touch-action:manipulation;
    transition:background .15s ease,border-color .15s ease,box-shadow .15s ease;
  }
  .cbx:checked{
    background:linear-gradient(180deg,#3FE0A4,#22B586);
    border-color:transparent;
    box-shadow:0 0 12px rgba(61,230,168,0.45);
  }
  .cbx:checked::after{content:'';width:6px;height:11px;border:solid #04120C;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px);}
  .cbx:focus-visible{outline:2px solid rgba(61,230,168,0.6);outline-offset:2px;}
  .item-main{flex:1;min-width:0;}
  .item-name{font-size:0.9rem;}
  .item.checked .item-name{color:var(--muted);}
  .item-plan{font-family:var(--data);font-size:0.64rem;color:var(--muted);display:block;margin-top:1px;}
  .delta{font-family:var(--data);font-size:0.62rem;font-weight:600;padding:1px 6px;border-radius:6px;margin-left:6px;white-space:nowrap;display:inline-block;}
  .delta.more{background:var(--debt-soft);color:var(--debt);}
  .delta.less{background:var(--asset-soft);color:var(--asset);}
  .del{
    background:none;border:none;color:#525A69;font-size:1.05rem;
    width:36px;height:36px;border-radius:10px;cursor:pointer;flex-shrink:0;
  }
  .del:hover{color:var(--debt);}
  .add-row{
    display:flex;gap:7px;padding:13px 16px;border-top:1px solid var(--line);
    background:rgba(255,255,255,0.025);flex-wrap:wrap;
  }
  .add-row input[type=text]{
    flex:1;min-width:120px;font-size:16px;padding:10px 12px;
    border:1px solid var(--line);border-radius:12px;font-family:var(--body);
    background:rgba(255,255,255,0.05);color:var(--ink);
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.30);
  }
  .add-row input[type=number]{
    width:96px;font-size:16px;padding:10px 12px;text-align:right;
    border:1px solid var(--line);border-radius:12px;font-family:var(--data);
    background:rgba(255,255,255,0.05);color:var(--ink);
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.30);
  }
  .add-row input:focus{outline:none;border-color:rgba(61,230,168,0.55);}
  .add-row input::placeholder{color:#5B6373;}
  .add-btn{
    background:linear-gradient(180deg,rgba(61,230,168,0.22),rgba(61,230,168,0.14));
    color:var(--asset);border:1px solid rgba(61,230,168,0.35);border-radius:12px;
    font-size:0.85rem;font-weight:600;padding:10px 16px;min-height:44px;cursor:pointer;
    box-shadow:0 0 14px rgba(61,230,168,0.15);
  }
  .add-btn:active{transform:translateY(1px);}

  .reset{
    display:block;margin:24px auto 0;
    background:rgba(255,255,255,0.04);border:1px solid var(--line);
    color:var(--muted);font-size:0.76rem;padding:10px 20px;border-radius:12px;
    min-height:44px;cursor:pointer;font-family:var(--body);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  }
  .footnote{text-align:center;font-size:0.7rem;color:#6A7383;margin-top:14px;line-height:1.5;}
  .loading{text-align:center;color:var(--muted);padding:36px 0;font-size:0.86rem;}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<div class="eyebrow" style="margin-bottom:2px;">Balans · <span id="todayLbl"></span></div>

<div class="hero">
  <div class="eyebrow">Netto vermogen</div>
  <div class="hero-net num neg" id="netVal">—</div>
  <div class="hero-sub" id="netSub">Bezittingen min schulden</div>

  <div class="track-wrap">
    <div class="track">
      <div class="track-debts" id="trkDebt" style="width:70%"></div>
      <div class="track-assets" id="trkAsset" style="width:30%"></div>
      <div class="track-tick" title="Break-even"></div>
    </div>
    <div class="track-legend">
      <div class="lg"><span class="k">Schulden</span><span class="v d num" id="lgDebt">—</span></div>
      <div class="lg right"><span class="k">Bezittingen</span><span class="v a num" id="lgAsset">—</span></div>
    </div>
    <div class="breakeven-note" id="beNote"></div>
  </div>

  <div class="spark" id="sparkWrap">
    <div class="eyebrow">Plan vs realiteit · netto binnen plan</div>
    <svg id="sparkSvg" viewBox="0 0 300 112" preserveAspectRatio="none"></svg>
    <div class="spark-label"><span id="sparkFrom"></span><span id="sparkNow"></span><span id="sparkTo"></span></div>
  </div>
</div>

<div class="meters" id="meters"></div>

<div class="section" id="secAssets">
  <div class="section-head" data-toggle="assets">
    <span class="title">Bezittingen</span>
    <span class="right"><span class="section-total a num" id="totAssets">—</span><span class="caret">▶</span></span>
  </div>
  <div class="section-body" id="bodyAssets"></div>
</div>

<div class="section" id="secDebts">
  <div class="section-head" data-toggle="debts">
    <span class="title">Schulden</span>
    <span class="right"><span class="section-total d num" id="totDebts">—</span><span class="caret">▶</span></span>
  </div>
  <div class="section-body" id="bodyDebts"></div>
</div>

<div class="section" id="secTotals" style="margin-top:16px;">
  <div style="padding:14px 16px 4px;"><span class="eyebrow">Totaaloverzicht</span></div>
  <div id="bodyTotals"></div>
</div>

<div class="phase" style="margin-top:26px;">Maandelijkse opvolging</div>
<div id="app"><div class="loading">Bezig met laden…</div></div>

<button class="reset" id="resetBtn">Alles resetten</button>
<div class="footnote">Tik op een maand om te openen. Vink af wat betaald is en pas het bedrag aan als het afwijkt.</div>

<script>
(function(){
  "use strict";

  /* ---------------- Plan definition ---------------- */
  const NL=["Januari","Februari","Maart","April","Mei","Juni","Juli","Augustus","September","Oktober","November","December"];
  function range(y,m,n){const a=[];for(let i=0;i<n;i++){const d=new Date(y,m+i,1);a.push({y:d.getFullYear(),m:d.getMonth()});}return a;}

  // Actieplan aug 2026 – dec 2028. Per rij: [jaar, maand(0-based), auto+leefgeld,
  // buy way, noodbuffer 1, buffer 2 (bruiloft), beleggingen, projectie netto binnen plan, milestone]
  const ROWS=[
    [2026,8, 1242.77, 250,    519.68,  0,       0,       1354.91, null],
    [2026,9, 1242.77, 250,    519.68,  0,       0,       2124.59, null],
    [2026,10,1242.77, 638.77, 1930.91, 0,       0,       4694.27, "Buy Way volledig afgelost"],
    [2026,11,1442.77, 0,      1336.73, 266.50,  266.45,  6563.95, "Noodbuffer 1 op €5.000"],
    [2027,0, 1242.77, 0,      0,       384.84,  384.84,  7333.63, null],
    [2027,1, 1342.77, 0,      0,       334.84,  334.84,  8003.31, null],
    [2027,2, 1242.77, 0,      0,       384.84,  384.84,  8772.99, null],
    [2027,3, 1242.77, 0,      0,       384.84,  384.84,  9542.67, null],
    [2027,4, 1242.77, 0,      0,       1534.84, 1534.84, 12612.35,"Vakantiegeld-boost"],
    [2027,5, 1242.77, 0,      0,       384.84,  384.84,  13382.03,null],
    [2027,6, 1242.77, 0,      0,       384.84,  384.84,  14151.71,null],
    [2027,7, 1242.77, 0,      0,       384.84,  384.84,  14921.39,null],
    [2027,8, 1242.77, 0,      0,       384.84,  384.84,  15691.07,null],
    [2027,9, 1242.77, 0,      0,       384.84,  384.84,  16460.75,null],
    [2027,10,1242.77, 0,      0,       1284.84, 1284.85, 19030.44,"13e maand → buffer + beurs"],
    [2027,11,1442.77, 0,      0,       1000.26, 1069.42, 21100.12,"Buffer 2 (bruiloft) op €7.500"],
    [2028,0, 1242.77, 0,      0,       0,       769.68,  21869.80,null],
    [2028,1, 1242.77, 0,      0,       0,       769.68,  22639.48,null],
    [2028,2, 1242.77, 0,      0,       0,       769.68,  23409.16,null],
    [2028,3, 1242.77, 0,      0,       0,       769.68,  24178.84,null],
    [2028,4, 1242.77, 0,      0,       0,       3069.68, 27248.52,"Vakantiegeld → beurs"],
    [2028,5, 1242.77, 0,      0,       0,       769.68,  28018.20,null],
    [2028,6, 1242.77, 0,      0,       0,       769.68,  28787.88,null],
    [2028,7, 1242.77, 0,      0,       0,       769.68,  29557.56,null],
    [2028,8, 1242.77, 0,      0,       0,       769.68,  30327.24,null],
    [2028,9, 1242.77, 0,      0,       0,       769.68,  31096.92,null],
    [2028,10,1242.77, 0,      0,       0,       2569.68, 33666.60,null],
    [2028,11,1442.77, 0,      0,       0,       1869.68, 35536.28,"Eind: €23k belegd · €35,5k netto"]
  ];
  const PROJ_START={y:2026,m:7,net:585.23}; // aug 2026, startpunt van het plan

  function phaseOf(y,m){
    if(y===2026)return "Fase 1 · Schuld weg + noodbuffer";
    if(y===2027)return "Fase 2 · Buffer 2 (bruiloft) + beleggen";
    return "Fase 3 · Alles naar de beurs";
  }
  const plan=[];
  ROWS.forEach(function(r){
    const y=r[0],m=r[1];
    const items=[["Auto + leefgeld",r[2]]];
    if(r[3]>0)items.push(["Buy Way aflossing",r[3]]);
    if(r[4]>0)items.push(["Noodbuffer 1",r[4]]);
    if(r[5]>0)items.push(["Buffer 2 (bruiloft)",r[5]]);
    if(r[6]>0)items.push(["Beleggingen",r[6]]);
    plan.push({
      key:y+"-"+String(m+1).padStart(2,"0"),
      label:NL[m]+" "+y,
      phase:phaseOf(y,m),
      milestone:r[8],
      items:items.map(function(p){return {name:p[0],amt:p[1]};})
    });
  });
  const PROJECTION=[{key:"2026-08",net:PROJ_START.net}].concat(ROWS.map(function(r){
    return {key:r[0]+"-"+String(r[1]+1).padStart(2,"0"),net:r[7]};
  }));

  /* ---------------- Defaults ---------------- */
  const DEFAULT_ASSETS=[
    {id:"noodbuffer", group:"Noodbuffer 1",       label:"Revolut Spaarbuffer",       amt:1148, kind:"spaar"},
    {id:"nood_cash",  group:"Noodbuffer 1",       label:"Cash",                      amt:400,  kind:"spaar"},
    {id:"buffer2",    group:"Buffer 2 (bruiloft)",label:"Buffer 2 — Bruiloft",       amt:0,    kind:"buffer2"},
    {id:"kbc",        group:"Overige rekeningen", label:"KBC",                       amt:40,   kind:"cash"},
    {id:"revbiz",     group:"Overige rekeningen", label:"Revolut Business",          amt:80,   kind:"cash"},
    {id:"kbcinvest",  group:"Beleggingen",        label:"KBC Invest",                amt:181,  kind:"beleg"},
    {id:"revinvest",  group:"Beleggingen",        label:"Revolut Invest",            amt:850,  kind:"beleg"},
    {id:"peugeot",    group:"Overige bezittingen",label:"Peugeot 208 (2022, 96k km)",amt:9500, kind:"overig"},
    {id:"iphone",     group:"Overige bezittingen",label:"iPhone 17 Pro Max",         amt:1000, kind:"overig"},
    {id:"vordering",  group:"Overige bezittingen",label:"Vorderingen (lening)",      amt:367,  kind:"overig"},
    {id:"macmini",    group:"Overige bezittingen",label:"Mac Mini M1",               amt:300,  kind:"overig"}
  ];
  const DEFAULT_DEBTS=[
    {id:"buyway",    label:"Buy Way",    amt:1138.77, start:2500},
    {id:"stellantis",label:"Stellantis", amt:8560.23, start:8883.14,
     loanStart:"2024-07-29", loanEnd:"2029-07-28", monthly:322.77}
  ];
  const GOAL_NOOD=5000, GOAL_BUFFER2=7500, GOAL_BELEG=23036.28;

  /* ---------------- State ---------------- */
  let state={months:{},assets:null,debts:null,history:[]};
  let openMonth=null, openSection={assets:false,debts:false};
  let storageBroken=false;
  const KEY="finplan-v3";

  const fmt=function(n){
    const v=Number(n||0);
    return (v<0?"− ":"")+"€ "+Math.abs(v).toLocaleString("nl-BE",{minimumFractionDigits:2,maximumFractionDigits:2});
  };
  const fmtShort=function(n){
    const v=Number(n||0);
    return (v<0?"− ":"")+"€ "+Math.abs(v).toLocaleString("nl-BE",{maximumFractionDigits:0});
  };

  // Full months elapsed from an ISO start date up to a reference date — a month only
  // counts once its due-day has passed, so this stays accurate on every open, no manual updates needed.
  function monthsElapsed(startISO,refDate){
    const start=new Date(startISO+"T00:00:00");
    let n=(refDate.getFullYear()-start.getFullYear())*12+(refDate.getMonth()-start.getMonth());
    if(refDate.getDate()<start.getDate())n--;
    return Math.max(0,n);
  }

  async function load(){
    if(!window.storage||typeof window.storage.get!=="function"){storageBroken=true;return null;}
    try{
      const r=await window.storage.get(KEY,false);
      if(r&&r.value){
        const p=JSON.parse(r.value);
        if(p&&typeof p==="object")return p;
      }
    }catch(e){/* nothing stored yet — defaults stay */}
    return null;
  }

  const SEED_VERSION=14;

  function hydrate(){
    if(!Array.isArray(state.assets)||!state.assets.length)state.assets=JSON.parse(JSON.stringify(DEFAULT_ASSETS));
    if(!Array.isArray(state.debts)||!state.debts.length)state.debts=JSON.parse(JSON.stringify(DEFAULT_DEBTS));
    if(!Array.isArray(state.history))state.history=[];
    if(!state.months||typeof state.months!=="object")state.months={};

    // Nieuw actieplan toegepast — vervangt balans en maandstructuur eenmalig, ook over oudere saves
    if(state.seedVersion!==SEED_VERSION){
      state.assets=JSON.parse(JSON.stringify(DEFAULT_ASSETS));
      state.debts=JSON.parse(JSON.stringify(DEFAULT_DEBTS));
      state.months={}; // oude maandstructuur past niet meer op het nieuwe plan
      state.seedVersion=SEED_VERSION;
    }
  }

  async function save(){
    try{
      await window.storage.set(KEY,JSON.stringify(state),false);
      storageBroken=false;
    }catch(e){
      storageBroken=true;
    }
  }

  function recordHistory(){
    const t=totals();
    const d=new Date();
    const stamp=String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
    const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const h=state.history;
    const entry={date:stamp,iso:iso,net:Math.round(t.net*100)/100,plan:Math.round(t.planNet*100)/100};
    if(!h.length||h[h.length-1].iso!==iso)h.push(entry);
    else h[h.length-1]=entry;
    if(h.length>80)h.splice(0,h.length-80);
    save();
  }

  function monthState(m){
    const n=m.items.length;
    let s=state.months[m.key];
    if(!s){s={checks:new Array(n).fill(false),actuals:m.items.map(function(i){return i.amt;}),extra:[]};state.months[m.key]=s;}
    if(!Array.isArray(s.checks))s.checks=new Array(n).fill(false);
    while(s.checks.length<n)s.checks.push(false);
    if(!Array.isArray(s.actuals)||s.actuals.length!==n)
      s.actuals=m.items.map(function(i,idx){return (s.actuals&&s.actuals[idx]!=null)?s.actuals[idx]:i.amt;});
    if(!Array.isArray(s.extra))s.extra=[];
    return s;
  }

  /* ---------------- Totals ---------------- */
  function totals(){
    const a=state.assets.reduce(function(s,x){return s+Number(x.amt||0);},0);
    const d=state.debts.reduce(function(s,x){return s+Number(x.amt||0);},0);
    const spaar=state.assets.filter(function(x){return x.kind==="spaar";}).reduce(function(s,x){return s+Number(x.amt||0);},0);
    const beleg=state.assets.filter(function(x){return x.kind==="beleg";}).reduce(function(s,x){return s+Number(x.amt||0);},0);
    const cash=state.assets.filter(function(x){return x.kind==="cash";}).reduce(function(s,x){return s+Number(x.amt||0);},0);
    const buffer2=state.assets.filter(function(x){return x.kind==="buffer2";}).reduce(function(s,x){return s+Number(x.amt||0);},0);
    const buyway=state.debts.filter(function(x){return x.id==="buyway";}).reduce(function(s,x){return s+Number(x.amt||0);},0);
    const planNet=spaar+buffer2+beleg-buyway;
    return {assets:a,debts:d,net:a-d,spaar:spaar,beleg:beleg,cash:cash,buffer2:buffer2,planNet:planNet};
  }

  /* ---------------- Render: hero ---------------- */
  function renderHero(){
    const t=totals();
    const el=document.getElementById("netVal");
    el.textContent=fmt(t.net);
    el.className="hero-net num "+(t.net<0?"neg":"pos");
    document.getElementById("netSub").textContent =
      t.net<0 ? "Nog "+fmt(Math.abs(t.net))+" te overbruggen tot break-even"
              : "Je staat "+fmt(t.net)+" boven break-even";

    const sum=t.assets+t.debts;
    const dp=sum?(t.debts/sum*100):50, ap=sum?(t.assets/sum*100):50;
    document.getElementById("trkDebt").style.width=dp+"%";
    document.getElementById("trkAsset").style.width=ap+"%";
    document.getElementById("lgDebt").textContent=fmt(t.debts);
    document.getElementById("lgAsset").textContent=fmt(t.assets);
    document.getElementById("beNote").textContent =
      "Break-even bij het streepje — bezittingen dekken dan de schuld";
    document.getElementById("totAssets").textContent=fmt(t.assets);
    document.getElementById("totDebts").textContent=fmt(t.debts);

    renderSpark();
  }

  function monthIdx(key){
    const p=key.split("-"),y=+p[0],m=+p[1];
    return (y-2026)*12+(m-1)-7; // 0 = aug 2026
  }

  function renderSpark(){
    const W=300,H=112,pad=8,padB=6;
    const maxIdx=monthIdx(PROJECTION[PROJECTION.length-1].key);
    const actual=(state.history||[]).filter(function(e){return e.iso&&typeof e.plan==="number";});
    const t=totals();

    let vals=PROJECTION.map(function(p){return p.net;}).concat(actual.map(function(e){return e.plan;}),[0,t.planNet]);
    const min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
    const span=(max-min)||1;
    const X=function(idx){return pad+(idx/maxIdx)*(W-pad*2);};
    const Y=function(v){return H-padB-((v-min)/span)*(H-pad-padB);};

    let svg="";
    // zero line
    if(0>=min&&0<=max)svg+='<line x1="0" y1="'+Y(0).toFixed(1)+'" x2="'+W+'" y2="'+Y(0).toFixed(1)+'" stroke="#2B313D" stroke-width="1" stroke-dasharray="3 3"/>';
    // plan projection: dashed, muted
    const pts=PROJECTION.map(function(p){return X(monthIdx(p.key)).toFixed(1)+","+Y(p.net).toFixed(1);});
    svg+='<polyline points="'+pts.join(" ")+'" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>';
    // milestone dots on the plan line
    ["2026-11","2026-12","2027-12","2028-12"].forEach(function(k){
      const pr=PROJECTION.find(function(p){return p.key===k;});
      if(pr)svg+='<circle cx="'+X(monthIdx(k)).toFixed(1)+'" cy="'+Y(pr.net).toFixed(1)+'" r="3" fill="none" stroke="#F0BC64" stroke-width="1.4"/>';
    });
    // actual line: realised "netto binnen plan"
    if(actual.length){
      const last=actual[actual.length-1].plan;
      const col=last<0?"#FF7A6E":"#3DE6A8";
      document.getElementById("sparkSvg").style.filter="drop-shadow(0 0 6px "+(last<0?"rgba(255,122,110,0.4)":"rgba(61,230,168,0.4)")+")";
      const apts=actual.map(function(e){
        const d=parseInt(e.iso.slice(8,10)||"15",10);
        return X(monthIdx(e.iso.slice(0,7))+(d-1)/30).toFixed(1)+","+Y(e.plan).toFixed(1);
      });
      if(apts.length>1)svg+='<polyline points="'+apts.join(" ")+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
      const lp=apts[apts.length-1].split(",");
      svg+='<circle cx="'+lp[0]+'" cy="'+lp[1]+'" r="3" fill="'+col+'"/>';
    }
    document.getElementById("sparkSvg").innerHTML=svg;
    document.getElementById("sparkFrom").textContent="aug \u201926";
    document.getElementById("sparkTo").textContent="dec \u201928 · "+fmtShort(35536.28);
    // delta vs plan for the current month
    const nowKey=new Date().getFullYear()+"-"+String(new Date().getMonth()+1).padStart(2,"0");
    const target=PROJECTION.find(function(p){return p.key===nowKey;});
    if(target){
      const diff=t.planNet-target.net;
      document.getElementById("sparkNow").textContent="nu "+fmtShort(t.planNet)+" ("+(diff>=0?"+":"−")+fmtShort(Math.abs(diff)).replace("€ ","€")+" vs plan)";
    }else{
      document.getElementById("sparkNow").textContent="nu "+fmtShort(t.planNet);
    }
  }

  /* ---------------- Render: meters ---------------- */
  function renderMeters(){
    const t=totals();
    const cards=[];
    const today=new Date();
    state.debts.forEach(function(d){
      let paid,pct,sub,extra="";
      if(d.loanStart&&d.loanEnd&&d.monthly){
        const totalM=monthsElapsed(d.loanStart,new Date(d.loanEnd+"T00:00:00"))+1;
        const doneM=Math.min(totalM,monthsElapsed(d.loanStart,today)+1);
        const totalPrice=totalM*d.monthly;
        paid=doneM*d.monthly;
        pct=totalPrice?Math.min(100,paid/totalPrice*100):0;
        sub=fmtShort(paid)+" afbetaald van "+fmtShort(totalPrice);
        extra='<div class="sub" style="margin-top:3px;">'+doneM+'/'+totalM+' maandtermijnen</div>';
      }else{
        const start=Number(d.start||d.amt||0);
        paid=Math.max(0,start-Number(d.amt||0));
        pct=start?Math.min(100,paid/start*100):0;
        sub=fmtShort(paid)+" afbetaald";
      }
      cards.push({k:d.label+" restschuld",v:fmt(d.amt),sub:sub,pct:pct,cls:"d",extra:extra});
    });
    cards.push({k:"Noodbuffer 1",v:fmt(t.spaar),sub:"doel "+fmtShort(GOAL_NOOD)+" · dec 2026",pct:Math.min(100,t.spaar/GOAL_NOOD*100),cls:"a"});
    cards.push({k:"Buffer 2 · bruiloft",v:fmt(t.buffer2),sub:"doel "+fmtShort(GOAL_BUFFER2)+" · dec 2027",pct:Math.min(100,t.buffer2/GOAL_BUFFER2*100),cls:"a"});
    cards.push({k:"Beleggingen",v:fmt(t.beleg),sub:"doel "+fmtShort(GOAL_BELEG)+" · dec 2028",pct:Math.min(100,t.beleg/GOAL_BELEG*100),cls:"a"});

    document.getElementById("meters").innerHTML=cards.map(function(c){
      return '<div class="meter"><span class="k">'+c.k+'</span>'+
             '<div class="v">'+c.v+'</div><div class="sub">'+c.sub+'</div>'+
             '<div class="meter-bar"><i class="'+c.cls+'" style="width:'+c.pct.toFixed(1)+'%"></i></div>'+
             (c.extra||'')+'</div>';
    }).join("");
  }

  /* ---------------- Render: balance sheet ---------------- */
  function numInput(val,onChange){
    const i=document.createElement("input");
    i.type="number";i.step="0.01";i.className="amt-in";
    i.setAttribute("inputmode","decimal");
    i.value=(val==null?"":val);
    i.addEventListener("change",function(){
      const v=parseFloat(i.value);
      onChange(isNaN(v)?0:v);
    });
    return i;
  }

  function renderBalance(){
    const ab=document.getElementById("bodyAssets");
    ab.innerHTML="";
    state.assets.forEach(function(a){
      const row=document.createElement("div");row.className="line-row";
      const lab=document.createElement("div");lab.className="line-label";
      lab.innerHTML='<span class="grp">'+a.group+'</span><span class="nm">'+a.label+'</span>';
      const eu=document.createElement("span");eu.className="euro";eu.textContent="€";
      const inp=numInput(a.amt,function(v){a.amt=v;save();renderHero();renderMeters();});
      row.appendChild(lab);row.appendChild(eu);row.appendChild(inp);
      ab.appendChild(row);
    });
    ab.classList.toggle("open",openSection.assets);

    const db=document.getElementById("bodyDebts");
    db.innerHTML="";
    state.debts.forEach(function(d){
      const row=document.createElement("div");row.className="line-row";
      const lab=document.createElement("div");lab.className="line-label";
      lab.innerHTML='<span class="grp">Restschuld</span><span class="nm">'+d.label+'</span>';
      const eu=document.createElement("span");eu.className="euro";eu.textContent="€";
      const inp=numInput(d.amt,function(v){d.amt=v;save();renderHero();renderMeters();});
      row.appendChild(lab);row.appendChild(eu);row.appendChild(inp);
      db.appendChild(row);
    });
    db.classList.toggle("open",openSection.debts);

    document.querySelectorAll(".section-head .caret")[0].classList.toggle("open",openSection.assets);
    document.querySelectorAll(".section-head .caret")[1].classList.toggle("open",openSection.debts);
  }

  function renderTotals(){
    const t=totals();
    const rows=[
      ["Noodbuffer 1",fmt(t.spaar),false],
      ["Buffer 2 (bruiloft)",fmt(t.buffer2),false],
      ["Cash rekeningen",fmt(t.cash),false],
      ["Beleggingen",fmt(t.beleg),false],
      ["Netto binnen plan",fmt(t.planNet),true],
      ["Totaal Bezittingen (Assets)",fmt(t.assets),true],
      ["Totale Schulden (Debts)",fmt(t.debts),true],
      ["Netto Vermogen",fmt(t.net),true]
    ];
    document.getElementById("bodyTotals").innerHTML=rows.map(function(r,i){
      const last=i===rows.length-1;
      const color=last?(t.net<0?"var(--debt)":"var(--asset)"):"";
      return '<div class="line-row"'+(r[2]?' style="border-top:1px solid var(--line);"':'')+'>'+
             '<div class="line-label"><span class="nm"'+(r[2]?' style="font-weight:700;"':'')+'>'+r[0]+'</span></div>'+
             '<span class="euro num"'+(r[2]?' style="font-weight:700;color:'+(color||'var(--ink)')+';"':'')+'>'+r[1]+'</span>'+
             '</div>';
    }).join("");
  }

  /* ---------------- Render: months ---------------- */
  function itemRow(cfg){
    const row=document.createElement("div");
    row.className="item"+(cfg.checked?" checked":"");

    const cb=document.createElement("input");
    cb.type="checkbox";cb.className="cbx";cb.checked=!!cfg.checked;
    cb.addEventListener("change",function(e){cfg.onCheck(e.target.checked);});

    const main=document.createElement("div");main.className="item-main";
    const nm=document.createElement("div");nm.className="item-name";nm.textContent=cfg.name;
    main.appendChild(nm);
    if(cfg.planned!=null){
      const pl=document.createElement("span");pl.className="item-plan";
      pl.textContent="gepland "+fmt(cfg.planned);
      if(cfg.checked&&cfg.planned>0){
        const diff=(cfg.actual!=null?cfg.actual:cfg.planned)-cfg.planned;
        if(Math.abs(diff)>=0.01){
          const tag=document.createElement("span");
          tag.className="delta "+(diff>0?"more":"less");
          tag.textContent=(diff>0?"+":"−")+fmtShort(Math.abs(diff)).replace("€ ","€");
          pl.appendChild(tag);
        }
      }
      main.appendChild(pl);
    }

    const eu=document.createElement("span");eu.className="euro";eu.textContent="€";
    const inp=numInput(cfg.actual!=null?cfg.actual:(cfg.planned||0),cfg.onAmount);
    inp.disabled=!cfg.checked;

    row.appendChild(cb);row.appendChild(main);row.appendChild(eu);row.appendChild(inp);
    if(cfg.onDelete){
      const b=document.createElement("button");b.className="del";b.innerHTML="✕";
      b.setAttribute("aria-label","Verwijderen");
      b.addEventListener("click",function(e){e.stopPropagation();cfg.onDelete();});
      row.appendChild(b);
    }
    return row;
  }

  function renderMonths(){
    const app=document.getElementById("app");
    app.innerHTML="";
    let lastPhase=null;

    plan.forEach(function(m){
      const s=monthState(m);
      const open=openMonth===m.key;
      const planTotal=m.items.reduce(function(a,i){return a+i.amt;},0);
      const paidTotal=m.items.reduce(function(a,i,idx){return a+(s.checks[idx]?Number(s.actuals[idx]||0):0);},0)
                     +s.extra.reduce(function(a,x){return a+(x.checked?Number(x.amt||0):0);},0);
      const nTotal=m.items.length+s.extra.length;
      const nDone=s.checks.filter(Boolean).length+s.extra.filter(function(x){return x.checked;}).length;
      const done=nTotal>0&&nDone===nTotal;

      if(m.phase!==lastPhase){
        const p=document.createElement("div");p.className="phase";p.textContent=m.phase;
        app.appendChild(p);lastPhase=m.phase;
      }

      const card=document.createElement("div");card.className="month";

      const head=document.createElement("div");
      head.className="month-head"+(done?" done":"");
      head.innerHTML='<div><div class="month-name">'+m.label+'</div>'+
                     '<div class="month-sub">'+fmt(paidTotal)+" van "+fmt(planTotal)+'</div>'+
                     (m.milestone?'<div class="milestone">'+m.milestone+'</div>':'')+'</div>'+
                     '<span class="pill'+(done?" done":"")+'">'+nDone+"/"+nTotal+'</span>';
      head.addEventListener("click",function(){openMonth=open?null:m.key;renderMonths();});
      card.appendChild(head);

      const pr=document.createElement("div");pr.className="month-progress";
      pr.innerHTML='<i style="width:'+(planTotal?Math.min(100,paidTotal/planTotal*100):0)+'%"></i>';
      card.appendChild(pr);

      const body=document.createElement("div");body.className="month-body"+(open?" open":"");

      m.items.forEach(function(it,idx){
        body.appendChild(itemRow({
          name:it.name,planned:it.amt,checked:s.checks[idx],actual:s.actuals[idx],
          onCheck:function(v){s.checks[idx]=v;save();renderMonths();},
          onAmount:function(v){s.actuals[idx]=v;save();renderMonths();}
        }));
      });
      s.extra.forEach(function(x,i){
        body.appendChild(itemRow({
          name:x.name,planned:null,checked:x.checked,actual:x.amt,
          onCheck:function(v){x.checked=v;save();renderMonths();},
          onAmount:function(v){x.amt=v;save();renderMonths();},
          onDelete:function(){s.extra.splice(i,1);save();renderMonths();}
        }));
      });

      const add=document.createElement("div");add.className="add-row";
      add.innerHTML='<input type="text" placeholder="Extra post" class="xn">'+
                    '<input type="number" step="0.01" inputmode="decimal" placeholder="Bedrag" class="xa">'+
                    '<button class="add-btn">Toevoegen</button>';
      add.querySelector(".add-btn").addEventListener("click",function(){
        const n=add.querySelector(".xn").value.trim();
        const v=parseFloat(add.querySelector(".xa").value);
        if(!n||isNaN(v))return;
        s.extra.push({name:n,amt:v,checked:true});
        save();renderMonths();
      });
      body.appendChild(add);

      card.appendChild(body);
      app.appendChild(card);
    });
  }

  function renderAll(){renderHero();renderMeters();renderBalance();renderTotals();renderMonths();}

  /* ---------------- Events ---------------- */
  document.querySelectorAll(".section-head").forEach(function(h){
    h.addEventListener("click",function(){
      const k=h.getAttribute("data-toggle");
      openSection[k]=!openSection[k];
      renderBalance();
    });
  });

  document.getElementById("resetBtn").addEventListener("click",function(){
    if(!confirm("Alles resetten? Ook je balans en extra posten gaan terug naar de startwaarden."))return;
    state={months:{},assets:null,debts:null,history:[]};
    hydrate();save();renderAll();
  });

  /* ---------------- Init ---------------- */
  (function stampDate(){
    const d=new Date();
    document.getElementById("todayLbl").textContent=d.getDate()+" "+NL[d.getMonth()].toLowerCase()+" "+d.getFullYear();
  })();

  function safeRender(){
    try{renderAll();return true;}
    catch(e){
      console.error(e);
      const a=document.getElementById("app");
      if(a)a.innerHTML='<div class="loading">Er ging iets mis bij het tekenen van dit scherm.</div>';
      return false;
    }
  }

  /* Paint straight away with the defaults — nothing waits on storage.
     Stored progress is merged in afterwards and the screen redraws. */
  hydrate();
  safeRender();

  (async function loadStored(){
    let stored=null;
    try{
      stored=await Promise.race([
        load(),
        new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"));},1500);})
      ]);
    }catch(e){/* keep the defaults already on screen */}
    if(stored){
      state=Object.assign(state,stored);
      // the flag must come from the stored data, not from the first paint,
      // otherwise a correction never reaches an older save
      state.seedVersion=stored.seedVersion;
      hydrate();
      safeRender();
    }
    recordHistory();
    renderSpark();
  })();

})();
</script>
</body>
</html>
